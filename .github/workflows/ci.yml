name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    name: Build (web + Go) & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- Build the embedded UI FIRST, otherwise //go:embed has nothing ---
      - name: Build web UI (populates internal/server/webassets)
        working-directory: web
        run: |
          npm ci || npm install --no-audit --no-fund
          npx tsc --noEmit
          npx vite build

      # Now the embedded assets exist, so the Go binary can compile.
      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Gofmt check
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "These files need gofmt:"
            echo "$out"
            exit 1
          fi

      - name: Test
        run: go test ./... -count=1
