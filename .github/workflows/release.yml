name: Release

on:
  push:
    tags:
      - 'v*'                 # pushing OR creating-on-GitHub a tag vX.Y.Z triggers this
  workflow_dispatch:          # optional manual runs
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0)'
        required: true
        default: 'v0.0.0'

permissions:
  contents: write

env:
  GO_VERSION: '1.22'
  NODE_VERSION: '20'

jobs:
  release:
    name: Build binaries & publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve version tag
        id: tag
        run: |
          # For a tag push, GITHUB_REF_NAME is the tag (the commit the tag points at).
          # checkout already placed the repo at that exact commit.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building release: tag=$TAG  commit=${GITHUB_SHA}"

      - name: Detect module path and main package
        id: mod
        run: |
          MODPATH="$(go list -m)"
          MAINPKG="$(go list -f '{{if and (eq .Name "main") (not .ForTest)}}{{.ImportPath}}{{end}}' ./... \
                     | grep -v '/thirdparty/' \
                     | sed '/^$/d' | head -1)"
          [ -z "$MAINPKG" ] && { echo "::error::no package main found"; exit 1; }
          echo "module=$MODPATH  main=$MAINPKG"
          echo "modpath=$MODPATH" >> "$GITHUB_OUTPUT"
          echo "mainpkg=$MAINPKG" >> "$GITHUB_OUTPUT"

      - name: Build the embedded web UI
        working-directory: web
        run: |
          npm ci || npm install --no-audit --no-fund
          npx tsc --noEmit
          npx vite build

      - name: Cross-compile binaries
        env:
          MOD: ${{ steps.mod.outputs.modpath }}
          MAIN: ${{ steps.mod.outputs.mainpkg }}
          VERSION: ${{ steps.tag.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          LDFLAGS="-X ${MOD}/internal/version.Version=${VERSION} \
                   -X ${MOD}/internal/version.Commit=${COMMIT} \
                   -X ${MOD}/internal/version.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
                   -s -w"
          build() { GOOS="$1" GOARCH="$2" go build -trimpath -ldflags "$LDFLAGS" -o "dist/$3" "$MAIN"; }

          build linux   amd64 sftpbox
          tar -C dist -czf dist/sftpbox-linux-amd64.tar.gz   sftpbox && rm dist/sftpbox
          build darwin  amd64 sftpbox
          tar -C dist -czf dist/sftpbox-macos-amd64.tar.gz   sftpbox && rm dist/sftpbox
          build darwin  arm64 sftpbox
          tar -C dist -czf dist/sftpbox-macos-arm64.tar.gz   sftpbox && rm dist/sftpbox
          build windows amd64 sftpbox.exe
          (cd dist && zip -q sftpbox-windows-amd64.zip sftpbox.exe) && rm dist/sftpbox.exe

          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)
          ls -lh dist

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          ASSETS=(
            dist/sftpbox-linux-amd64.tar.gz
            dist/sftpbox-macos-amd64.tar.gz
            dist/sftpbox-macos-arm64.tar.gz
            dist/sftpbox-windows-amd64.zip
            dist/checksums.txt
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — replacing assets…"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            echo "Creating release $TAG…"
            gh release create "$TAG" --title "SftpBox $TAG" --generate-notes "${ASSETS[@]}"
          fi
